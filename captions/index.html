<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创作者字幕包 · 开发中 — UNPAUSE CREATIVE</title>
<meta name="description" content="创作者字幕包 · 开发中，请等待。UNPAUSE CREATIVE。">
<meta property="og:title" content="创作者字幕包 — UNPAUSE CREATIVE">
<meta property="og:description" content="创作者字幕包 · 开发中，请等待。">
<meta property="og:image" content="assets/poster.webp">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0a0a;--panel:#111110;--paper:#faf8f5;--paper-dim:#f0ede7;
  --orange:#f96130;--grey:#8c8b84;
  --line-dark:rgba(250,248,245,.14);--line-light:rgba(10,10,10,.12);
  --cjk:'Noto Sans SC',sans-serif;--latin:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--ink);color:var(--paper);font-family:var(--cjk),var(--latin);line-height:1.7;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
::selection{background:var(--orange);color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.wrap p,.wrap h1,.wrap h2,.wrap h3,.wrap li,.wrap summary,.wrap b{overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--cjk);font-weight:900;line-height:1.2;letter-spacing:0;text-wrap:balance}
.hl{display:block}
.hl.o{color:var(--orange)}
em{font-style:normal;color:var(--orange)}
.cap{font-family:var(--latin);text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;color:var(--grey);font-weight:600}
.cap b{color:var(--orange);font-weight:700}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* header */
header.site{position:fixed;inset:0 0 auto 0;z-index:300;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;transition:background .4s,padding .4s,box-shadow .4s}
header.site.solid{background:rgba(10,10,10,.92);backdrop-filter:blur(6px);padding:12px 32px;box-shadow:0 1px 0 var(--line-dark)}
.brand-logo{height:26px;width:auto;transition:height .4s}
header.site.solid .brand-logo{height:22px}
.hdr-right{display:flex;align-items:center;gap:26px}
.hdr-right a{font-size:.82rem;color:#fff;transition:color .2s;white-space:nowrap}
.hdr-right a:hover{color:var(--orange)}
.hdr-right a.back{opacity:.8}
.hdr-right a.buy{color:var(--ink);background:var(--orange);border-radius:16px;padding:6px 16px;font-weight:700}
.hdr-right a.buy:hover{background:var(--paper);color:var(--ink)}
@media (max-width:760px){.hdr-right a.hide-m{display:none}header.site,header.site.solid{padding-left:18px;padding-right:18px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--cjk);font-weight:700;font-size:.95rem;padding:14px 28px;border-radius:40px;transition:all .25s ease;cursor:pointer;border:1px solid transparent;text-align:center}
.btn.primary{background:var(--orange);color:var(--ink)}
.btn.primary:hover{background:var(--paper);transform:translateY(-2px)}
.btn.ghost{border-color:rgba(255,255,255,.4);color:var(--paper)}
.btn.ghost:hover{border-color:var(--orange);color:var(--orange)}

/* hero (compact, centered) */
.hero{position:relative;padding:118px 0 54px;text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;width:90vw;height:60vw;left:50%;top:0;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 30%,rgba(249,97,48,.26),rgba(249,97,48,0) 62%);pointer-events:none}
.hero .wrap{position:relative;z-index:2}
.hero-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;margin-bottom:18px}
.chip{font-size:.78rem;border:1px solid var(--line-dark);border-radius:30px;padding:3px 14px}
.chip.o{border-color:var(--orange);color:var(--orange)}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.8rem);line-height:1.16;margin:14px 0 12px}
.hero-en{font-family:var(--latin);font-weight:700;font-size:clamp(.74rem,1.5vw,.92rem);letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:14px}
.hero-sub{max-width:560px;margin:0 auto 24px;color:rgba(250,248,245,.8);font-size:1rem}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 44px;margin-top:30px}
.fact b{display:block;font-family:var(--latin);font-weight:800;font-size:1.5rem;color:var(--paper);line-height:1.2;letter-spacing:-.01em}
.fact span{font-size:.76rem;color:var(--grey)}

/* wall: moving subtitles */
.wall{padding:40px 0 46px;overflow:hidden;background:var(--ink);border-block:1px solid var(--line-dark)}
.wall-head{text-align:center;margin-bottom:24px;padding:0 24px}
.wall-head h2{font-size:clamp(1.55rem,4vw,2.6rem);line-height:1.22;margin-top:8px}
.wall-row{display:flex;gap:14px;width:max-content;animation:wl 90s linear infinite;margin-bottom:14px}
.wall-row.r{animation-direction:reverse;animation-duration:105s;margin-bottom:0}
.wall:hover .wall-row{animation-play-state:paused}
.wall-row img{height:170px;width:227px;flex:none;object-fit:cover;border-radius:6px;border:1px solid var(--line-dark);background:#000}
@keyframes wl{to{transform:translateX(-50%)}}
@media (max-width:600px){.wall-row img{height:128px;width:171px}.wall-row.r{display:none}}
@media (prefers-reduced-motion:reduce){.wall-row{animation:none}}

/* sections */
section{position:relative}
.sec{padding:72px 0}
.sec.paper{background:var(--paper);color:var(--ink)}
.sec h2{font-size:clamp(1.65rem,4vw,2.8rem);line-height:1.22;margin:10px 0 12px}
.lead{max-width:620px;font-size:1rem;opacity:.82}
.sec-head{margin-bottom:34px}

/* pricing: video left, prices right */
.pricing-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:48px;align-items:start}
.vcol{position:sticky;top:84px}
.phone{position:relative;aspect-ratio:9/16;border-radius:34px;padding:8px;background:linear-gradient(160deg,#2a2a28,#0d0d0c);box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1),0 0 70px rgba(249,97,48,.2)}
.phone video{width:100%;height:100%;object-fit:cover;border-radius:27px;background:#000}
.phone::before{content:"";position:absolute;z-index:3;top:14px;left:50%;transform:translateX(-50%);width:72px;height:19px;border-radius:12px;background:#000}
.snd{position:absolute;z-index:4;right:18px;bottom:18px;display:inline-flex;align-items:center;gap:7px;background:rgba(10,10,10,.78);backdrop-filter:blur(6px);border:1px solid var(--orange);color:var(--paper);font-family:var(--cjk);font-size:.74rem;padding:6px 12px;border-radius:24px;cursor:pointer;transition:background .2s}
.snd:hover{background:var(--orange);color:var(--ink)}
.snd svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vcap{margin-top:12px;text-align:center;font-size:.8rem;color:var(--grey)}
.plans{display:flex;flex-direction:column;gap:14px}
.plan{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:center;border:1px solid var(--line-dark);border-radius:8px;padding:22px 24px;background:var(--panel);transition:border-color .3s,transform .3s}
.plan:hover{border-color:rgba(249,97,48,.6)}
.plan .lvl{font-family:var(--latin);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);font-weight:600}
.plan h3{font-family:var(--latin);font-weight:800;font-size:1.6rem;line-height:1.15;margin:2px 0 10px;letter-spacing:-.02em}
.plan h3.cn{font-family:var(--cjk);font-weight:900}
.pl-list{list-style:none;display:flex;flex-wrap:wrap;gap:6px 8px}
.pl-list li{font-size:.8rem;border:1px solid var(--line-dark);border-radius:20px;padding:2px 12px;line-height:1.6}
.pl-list li.f{border-color:rgba(249,97,48,.6);color:var(--orange)}
.pl-buy{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
.was{font-size:.95rem;color:var(--grey)}
.was s{text-decoration-color:var(--orange);text-decoration-thickness:2px}
.price{display:flex;align-items:baseline;gap:4px;line-height:1}
.price small{font-family:var(--latin);font-weight:700;font-size:.95rem;color:var(--grey)}
.price b{font-family:var(--latin);font-weight:800;font-size:2.9rem;letter-spacing:-.03em;color:var(--paper)}
.save{font-family:var(--cjk);font-size:1.05rem;font-weight:900;color:var(--ink);background:var(--orange);border-radius:6px;padding:2px 14px;margin-bottom:8px;line-height:1.5}
.plan.hot .save{font-size:1.3rem;padding:3px 18px;background:linear-gradient(90deg,#ff7a45,#f96130);box-shadow:0 6px 24px rgba(249,97,48,.45)}
.plan .btn{padding:10px 22px;font-size:.88rem;white-space:nowrap}
.plan.hot{border:2px solid var(--orange);background:linear-gradient(160deg,#241810,#111110);box-shadow:0 0 60px rgba(249,97,48,.2)}
.plan.hot .price b{color:var(--orange)}
.plan.hot .price b{font-size:3.3rem}
.ribbon{position:absolute;top:-12px;left:22px;background:var(--orange);color:var(--ink);font-weight:900;font-size:.72rem;padding:2px 14px;border-radius:30px}

.who-for{display:inline-block;font-size:.8rem;font-weight:700;border-radius:20px;padding:2px 12px;margin:2px 0 10px;border:1px solid var(--line-dark);color:rgba(250,248,245,.85)}
.who-for.pro{border-color:#7fb3ff;color:#9ec6ff}
.who-for.best{border-color:var(--orange);color:var(--ink);background:var(--orange)}
.plan h3 + .who-for{margin-top:0}
.bonus{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:4px;padding:14px 16px;border:1.5px dashed rgba(249,97,48,.75);border-radius:8px;background:linear-gradient(90deg,rgba(249,97,48,.16),rgba(249,97,48,.05))}
.bonus-tag{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:.95rem;color:var(--ink);background:var(--orange);border-radius:6px;padding:2px 12px;white-space:nowrap}
.bonus ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.bonus li{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.92rem;background:rgba(10,10,10,.55);border:1px solid rgba(249,97,48,.55);border-radius:20px;padding:3px 14px}
.bonus li::before{content:"✦";color:var(--orange);font-size:.8rem}
.bonus li i{font-style:normal;font-family:var(--latin);font-weight:800;font-size:.62rem;letter-spacing:.1em;color:var(--orange)}
.plan.hot .bonus{border-style:solid;border-width:2px;background:linear-gradient(90deg,rgba(249,97,48,.28),rgba(249,97,48,.08));box-shadow:0 0 40px rgba(249,97,48,.18)}
.plan.hot .bonus li{font-size:1rem;padding:4px 16px}
.pay-note{margin-top:14px;font-size:.8rem;color:var(--grey)}
@media (max-width:900px){
  .pricing-grid{grid-template-columns:minmax(0,1fr);gap:30px}
  .vcol{position:static;width:min(250px,70vw);margin:0 auto}
}
@media (max-width:560px){
  .plan{grid-template-columns:minmax(0,1fr);padding:20px 18px}
  .pl-buy{text-align:left;align-items:flex-start;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px}
  .pl-buy .was{width:100%}
  .pl-buy .btn{margin-left:auto}
}

/* why */
.usp{background:linear-gradient(180deg,#0a0a0a,#15100c);border-top:1px solid var(--line-dark)}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.who span{font-size:.82rem;border:1px solid var(--line-dark);border-radius:30px;padding:2px 14px}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.uspcard{border:1px solid var(--line-dark);border-radius:8px;padding:24px 20px;background:var(--panel);transition:border-color .3s,transform .3s}
.uspcard:hover{border-color:rgba(249,97,48,.6);transform:translateY(-4px)}
.uspcard .n{font-family:var(--latin);font-weight:800;font-size:1.5rem;color:var(--orange);line-height:1}
.uspcard h3{font-size:1.1rem;margin:12px 0 6px}
.uspcard p{font-size:.88rem;color:rgba(250,248,245,.75)}
.uspcard.big{border-color:var(--orange);background:linear-gradient(160deg,#241810,#111110)}
@media (max-width:980px){.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cols4{grid-template-columns:minmax(0,1fr)}}
.license{margin-top:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-dark);border-radius:8px;overflow:hidden}
.license div{padding:18px 20px;font-size:.88rem;line-height:1.6;border-left:1px solid var(--line-dark)}
.license div:first-child{border-left:0}
.license b{display:block;font-size:.95rem;margin-bottom:2px}
.license .y b{color:var(--orange)}
.license .n{color:rgba(250,248,245,.65)}
@media (max-width:760px){.license{grid-template-columns:minmax(0,1fr)}.license div{border-left:0;border-top:1px solid var(--line-dark)}.license div:first-child{border-top:0}}

/* faq */
.faq{max-width:800px}
.faq details{border-top:1px solid var(--line-light);padding:16px 0}
.faq details:last-child{border-bottom:1px solid var(--line-light)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font-weight:700;font-size:1rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--latin);font-weight:300;font-size:1.5rem;line-height:1;color:var(--orange);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{margin-top:10px;font-size:.92rem;opacity:.8}
.faq code{font-family:'Inter',monospace;font-size:.74rem;background:var(--paper-dim);padding:2px 6px;border-radius:3px;word-break:break-all}

footer{background:var(--ink);padding:34px 0 90px;font-size:.8rem;color:rgba(250,248,245,.7);border-top:1px solid var(--line-dark)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
footer img{height:22px;width:auto}

/* mobile buy bar */
.bar{display:none}
@media (max-width:760px){.bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:280;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(10,10,10,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line-dark);transform:translateY(110%);transition:transform .4s}
.bar.show{transform:none}
.bar b{font-family:var(--latin);font-weight:800;font-size:1.4rem;color:var(--orange);line-height:1}
.bar s{font-size:.78rem;color:var(--grey);margin-left:6px;text-decoration-color:var(--orange)}
.bar span{display:block;font-size:.7rem;color:var(--grey)}
.bar .btn{padding:11px 22px;font-size:.88rem;flex:none}}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.soon{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;border:1px solid var(--orange);border-radius:40px;padding:14px 28px;margin:6px 0 10px;background:rgba(249,97,48,.08)}
.soon b{font-size:1.05rem;font-weight:700}.soon em{font-family:var(--latin);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
.soon-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);animation:sp 1.4s ease-in-out infinite}
@keyframes sp{50%{opacity:.25;transform:scale(.7)}}
.hero{padding-bottom:70px}
</style>
</head>
<body>

<header class="site" id="hdr">
  <a href="../index.html" aria-label="UNPAUSE CREATIVE 主站"><img class="brand-logo" src="assets/logo.png" alt="UNPAUSE CREATIVE"></a>
  <nav class="hdr-right"><a class="back" href="../index.html">← 返回主站</a></nav>
</header>

<!-- HERO -->
<section class="hero" id="top">
  <div class="wrap">
    <div class="hero-tags"><span class="chip o">剪映专业版预设</span><span class="chip">全部亲手设计</span></div>
    <p class="cap">UNPAUSE CREATIVE · <b>Creator Subtitle Pack</b></p>
    <h1><span class="hl">15 款字幕，</span><span class="hl o">全部亲手设计。</span></h1>
    <p class="hero-en">Hand-made by our team · Not AI-generated</p>
    <p class="hero-sub">每一款都是我们自己设计、自己做动画，不是 AI 生成的模板。</p>
    <div class="soon"><span class="soon-dot"></span><b>正在开发中，请等待</b><em>Coming Soon</em></div>
  </div>
</section>

<!-- WALL (moving subtitles) -->
<section class="wall" aria-label="15 款字幕动态一览">
  <div class="wall-head">
    <p class="cap">Every subtitle · <b>hand-designed</b></p>
    <h2><span class="hl">这么多字幕，</span><span class="hl o">全是我们亲手做。</span></h2>
  </div>
  <div class="wall-row" id="wallA" aria-hidden="true"></div>
  <div class="wall-row r" id="wallB" aria-hidden="true"></div>
</section>

<footer>
  <div class="wrap">
    <a href="../index.html"><img src="assets/logo.png" alt="UNPAUSE CREATIVE"></a>
    <span>© <span id="yr"></span> UNPAUSE CREATIVE · 字幕预设版权归 UNPAUSE CREATIVE 所有</span>
    <a href="../index.html" style="color:var(--orange)">← 返回主站</a>
  </div>
</footer>

<script>
(function(){
  var WA='60176816456';
  var $=function(id){return document.getElementById(id)};
  var pad=function(n){return (n<10?'0':'')+n};

  var hdr=$('hdr');
  function onS(){hdr.classList.toggle('solid',window.scrollY>40);}
  window.addEventListener('scroll',onS,{passive:true});onS();
  $('yr').textContent=new Date().getFullYear();

  /* moving subtitle wall (animated WebP loops of the real effects) */
  function wallRow(el,order){var h='';order.forEach(function(i){h+='<img src="assets/fx_'+pad(i+1)+'.webp" alt="" width="227" height="170">'});el.innerHTML=h+h}
  var ord=[];for(var q=0;q<15;q++)ord.push(q);
  wallRow($('wallA'),ord);
  wallRow($('wallB'),ord.slice(7).concat(ord.slice(0,7)));

  if(!('IntersectionObserver' in window)){document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in')});return}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  document.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
